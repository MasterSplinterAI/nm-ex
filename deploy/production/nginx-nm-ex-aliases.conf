# Alias domains → https://www.nm-ex.com
#
# After DNS A records point at this box:
#   sudo certbot certonly --webroot -w /var/www/html --cert-name nm-ex-aliases \
#     -d n-mex.com -d www.n-mex.com \
#     -d n-mx.com -d www.n-mx.com \
#     -d nigeriametalexchange.com -d www.nigeriametalexchange.com \
#     -d nigeriametalsexchange.com -d www.nigeriametalsexchange.com \
#     -d nigerianmetalexchange.com -d www.nigerianmetalexchange.com \
#     -d nigerianmetalsexchange.com -d www.nigerianmetalsexchange.com

server {
    listen 80;
    listen [::]:80;
    server_name
        n-mex.com www.n-mex.com
        n-mx.com www.n-mx.com
        nigeriametalexchange.com www.nigeriametalexchange.com
        nigeriametalsexchange.com www.nigeriametalsexchange.com
        nigerianmetalexchange.com www.nigerianmetalexchange.com
        nigerianmetalsexchange.com www.nigerianmetalsexchange.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.nm-ex.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name
        n-mex.com www.n-mex.com
        n-mx.com www.n-mx.com
        nigeriametalexchange.com www.nigeriametalexchange.com
        nigeriametalsexchange.com www.nigeriametalsexchange.com
        nigerianmetalexchange.com www.nigerianmetalexchange.com
        nigerianmetalsexchange.com www.nigerianmetalsexchange.com;

    ssl_certificate /etc/letsencrypt/live/nm-ex-aliases/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nm-ex-aliases/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.nm-ex.com$request_uri;
    }
}
